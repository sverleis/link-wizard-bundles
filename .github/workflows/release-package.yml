name: Build release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Stage production plugin
        run: |
          mkdir -p dist/link-wizard-bundles
          rsync -a ./ dist/link-wizard-bundles/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='.gitignore' \
            --exclude='node_modules/' \
            --exclude='admin/src/' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='webpack.config.js'

      - name: Create versioned ZIP
        run: |
          cd dist
          zip -qr "link-wizard-bundles-${GITHUB_REF_NAME}.zip" link-wizard-bundles

      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/link-wizard-bundles-${{ github.ref_name }}.zip
